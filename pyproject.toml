[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficflowbench"
version = "0.1.0"
description = "Локальный конвейер решения TrafficFlowBench 2026"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "PyYAML==6.0.3",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
