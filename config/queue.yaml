# Слой очереди. Порог скорости 0.6 * free_speed живёт в scoring.yaml.
# Здесь только правило, которое включает связь. На публичной таблице его не подбирали.

# Имена условий из window_index.csv. Другое имя команда отвергает, а не угадывает.
onset_condition: queue_onset
ongoing_condition: queue_ongoing

# Уже видимая очередь остаётся на своих связях. Каждые upstream_shift_every_steps
# шагов горизонта её хвост отмечается ещё на одной связи выше по потоку,
# но не дальше max_upstream_hops и не на весь коридор.
upstream_shift_every_steps: 3
max_upstream_hops: 1

# Onset в истории ещё не очередь: скорость там около свободной.
# Связь включается на будущей пятиминутке, если в train в тот же день недели
# и на тех же часах скорость была не выше порога строго чаще, чем нет.
recurrent_share_min: 0.5

artifact_dir: experiments/artifacts/v3
